apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyxus-gateway
  namespace: default        # must match the gateway Deployment's namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nyxus-runtime-manager
  namespace: nyxus-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nyxus-gateway-runtime-manager
  namespace: nyxus-agents
subjects:
  - kind: ServiceAccount
    name: nyxus-gateway
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nyxus-runtime-manager
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nyxus-agent-quota
  namespace: nyxus-agents
spec:
  hard:
    pods: "10"              # keep equal to MAX_ACTIVE_PODS