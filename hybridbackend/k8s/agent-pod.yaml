apiVersion: v1
kind: Pod
metadata:
  name: nyxus-agent-pod
  labels:
    app: nyxus-agent
spec:
  restartPolicy: Never
  containers:
    - name: agent-container
      image: nyxus-hybridbackend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
          name: http-socketio
      env:
        - name: WORKSPACE_ID
          value: "c3d9f5a6-bac3-47e8-9d68-2c8e6f617265"
        - name: USER_ID
          value: "usr_78a1bc23ef45"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: nyxus-secrets
              key: mongodb-uri
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: nyxus-secrets
              key: google-api-key
        - name: NYXUS_HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      livenessProbe:
        httpGet:
          path: /live
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /ready
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 5
