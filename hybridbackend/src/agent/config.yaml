# Switches for the agent. Phase changes = edit this file + add skill folders.
phase: 1

skills:
  - ensure-indexed
  - codebase-overview
  - locate-and-explain
  - trace-flow
  - architecture-diagram

# Codegraph tools exposed to the model (allowlist). Built-ins
# (use_skill, digest, scratchpad, find_files) are always on; run_shell is
# controlled separately by shell.enabled.
tools:
  - repo_orient
  - packet_get
  - search
  - find_symbol
  - explain
  - refs
  - callers
  - goto
  - deps
  - rdeps
  - read_file
  - grep
  - explore
  - doctor

limits:
  tool_output_tokens: 1500      # hard cap per tool result (approx; chars/4)
  max_tool_calls_per_task: 60
  max_read_file_calls: 15
  command_timeout_seconds: 120  # first call on a big repo may build the index
  max_steps: 15              # LangGraph recursion_limit for one task

shell:
  enabled: true
  timeout_seconds: 30

model:
  provider: gemini
  name: gemini-3.5-flash-lite
  api_key_env: GOOGLE_API_KEY
  request_timeout_seconds: 60

digest_model:
  provider: gemini
  name: gemini-3.5-flash-lite
  api_key_env: GOOGLE_API_KEY
  request_timeout_seconds: 60

context:
  window_tokens: 128000
  compact_fraction: 0.6
  recent_tool_results: 4
  keep_last_messages: 6

checkpoint:
  backend: memory              # memory | sqlite
  sqlite_path: .agent-checkpoints.sqlite

observability:
  langfuse:
    enabled: false
  langsmith:
    enabled: false
    endpoint: http://127.0.0.1:1984
    project: nyxus-local
  mongodb:
    enabled: true
    collection: observations
  local_trace:
    enabled: false
    max_entries: 200
    directory: .nyxus/traces
  hide_inputs_outputs: false

codegraph:
  transport: cli                # cli | mcp (this wrapper implements cli)
  binary: codegraph
  version: "PIN-ME"             # pin the version you tested
